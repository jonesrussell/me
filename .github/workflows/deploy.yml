name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Restore Svelte build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .svelte-kit
          key: svelte-build-${{ runner.os }}-node24-${{ hashFiles('package-lock.json', 'svelte.config.js', 'vite.config.ts', 'src/**') }}
          restore-keys: |
            svelte-build-${{ runner.os }}-node24-${{ hashFiles('package-lock.json', 'svelte.config.js', 'vite.config.ts') }}-
      - name: Build
        env:
          BASE_PATH: '/me'
          NODE_ENV: production
          VITE_GOFORMS_API_URL: 'https://api.goformx.com'
          VITE_GOFORMS_CONTACT_PUBLIC_KEY: ${{ vars.GOFORMS_CONTACT_PUBLIC_KEY }}
          VITE_GOFORMS_NEWSLETTER_PUBLIC_KEY: ${{ vars.GOFORMS_NEWSLETTER_PUBLIC_KEY }}
        run: npm run build

      - name: Verify browser bundle contains no GoFormX credential
        run: |
          if grep -R -E 'VITE_GOFORMS_API_KEY|X-API-Key|Authorization: Bearer' build/; then
            echo "A reusable GoFormX credential marker was found in the browser bundle."
            exit 1
          fi
          echo "No GoFormX credential markers found."

      - name: Verify no symlinks (Pages unsupported)
        run: |
          if find build/ -type l | read -r; then
            echo "Error: Symlinks found in the build directory!"
            exit 1
          fi
          echo "No symlinks found."

      - name: Clean up build directory
        run: |
          rm -rf build/tests build/tmp
          echo "Cleaned up build directory to reduce artifact size."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/
          retention-days: 30

      - name: List artifact contents
        run: du -sh build/* | sort -hr

  unit-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      DEBIAN_FRONTEND: noninteractive
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Restore Vitest cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/vitest
          key: vitest-${{ runner.os }}-node24-${{ hashFiles('package-lock.json', 'vite.config.ts', 'vitest-setup-client.ts', 'src/**/*.test.ts') }}
          restore-keys: |
            vitest-${{ runner.os }}-node24-${{ hashFiles('package-lock.json', 'vite.config.ts', 'vitest-setup-client.ts') }}-
      - name: Type check
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Run unit tests
        run: npm run test:unit:run

  e2e-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      DEBIAN_FRONTEND: noninteractive
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium webkit
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium webkit
      - name: Run E2E tests
        run: npm run test:e2e
      - name: Upload Playwright failure report and traces
        if: failure() && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, unit-tests, e2e-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      contents: read
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
